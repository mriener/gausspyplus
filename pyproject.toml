[project]
name = "gausspyplus"
version = "0.3.0"
description = "A fully automated Gaussian decomposition package for emission line spectra."
authors = [{ name = "Manuel Riener" }]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "astropy>=8.0",
    "lmfit>=1.3",
    "matplotlib>=3.11",
    "networkx>=3.6",
    "numpy>=2.4",
    "scipy>=1.17",
    "tqdm>=4.70",
]

[dependency-groups]
dev = [
    "black>=26.10",
    "jupyterlab>=4.0",
    "pre-commit>=4.0",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: slow end-to-end pipeline tests on the 10x10 test field",
]

[tool.black]
line-length = 119

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gausspyplus"]