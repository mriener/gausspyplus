# Hooks run directly from the project's uv environment, whose black
# version is pinned via uv.lock (the same version the CI formatting
# job checks). This keeps the hook network-free: no hook-repo download
# is needed, and 'uv run black' resolves the interpreter and
# environment through uv from the repository root (git hooks always
# run there).
repos:
-   repo: local
    hooks:
    -   id: black
        name: black
        entry: uv run black --
        language: system
        types: [python]
