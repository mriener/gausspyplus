name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Run test suite
        run: uv run pytest -q

  formatting:
    name: black --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting
        run: uv run black --check .

  compliance:
    name: dependency compliance (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        #  3.11 and 3.14 exercise both resolution pairs of the lock (the
        #  per-python-version resolution differs in contourpy, networkx,
        #  numpy, scipy)
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Check dependency licenses (permissive-only policy)
        #  pip-licenses runs as a transient layer over the project environment
        #  (--with) instead of being installed into it, so the environment is
        #  not polluted and needs no subsequent cleanup.
        run: |
          uv run --with pip-licenses pip-licenses --allow-only="Apache 2.0;Apache Software License;Apache Software License; BSD License;Apache Software License; MIT License;Apache-2.0;Apache-2.0 AND BSD-2-Clause;Apache-2.0 AND BSD-2-Clause AND BSD-3-Clause AND ISC AND MIT;Apache-2.0 OR BSD-2-Clause;Apache License, Version 2.0;BSD License;BSD-2-Clause;BSD-3-Clause;BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0;ISC License (ISCL);MIT;MIT License;MIT-0;MIT-CMU;MPL-2.0;MPL-2.0 AND MIT;Mozilla Public License 2.0 (MPL 2.0);PSF-2.0;Python Software Foundation License"
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv pip freeze | grep -v 'gausspyplus' > requirements-audit.txt
          pipx install pip-audit --force
          pip-audit --no-deps -r requirements-audit.txt
